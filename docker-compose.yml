services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports: ["${DB_PORT:-5432}:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      # Via TCP: durante o initdb o Postgres sobe um servidor temporário só no socket unix,
      # e checar pelo socket dava "pronto" antes de schema.sql/seed.sql terminarem.
      test: ["CMD-SHELL", "pg_isready -U relay -d relay -h 127.0.0.1"]
      start_period: 60s
      interval: 2s
      timeout: 3s
      retries: 15
  migrate:
    image: postgres:16
    environment:
      PGHOST: db
      PGUSER: relay
      PGPASSWORD: relay
      PGDATABASE: relay
    volumes:
      - ./db:/db:ro
    entrypoint: ["sh", "/db/migrate.sh"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://relay:relay@db:5432/relay
      PYTHONUNBUFFERED: "1"
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: ./worker
    environment:
      DATABASE_URL: postgresql://relay:relay@db:5432/relay
      PYTHONUNBUFFERED: "1"
    restart: on-failure
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build: ./web
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8000}
    ports: ["${WEB_PORT:-5173}:5173"]
    depends_on: [api]
