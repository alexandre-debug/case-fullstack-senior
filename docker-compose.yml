services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports: ["5432:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 2s
      timeout: 3s
      retries: 15
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://relay:relay@db:5432/relay
      PYTHONUNBUFFERED: "1"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: ./worker
    environment:
      DATABASE_URL: postgresql://relay:relay@db:5432/relay
      PYTHONUNBUFFERED: "1"
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./web
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [api]
